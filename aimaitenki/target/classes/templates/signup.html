<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>サインアップ | Aimaitenki</title>

  <!-- CSRF for forms -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <!-- Tailwind（CDN） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#6366f1'}}}}}</script>

  <style>
    .glass { background: rgba(255,255,255,.75); backdrop-filter: blur(10px); }
    .dark .glass { background: rgba(17,24,39,.6); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-indigo-100 to-fuchsia-100 dark:from-slate-900 dark:via-slate-900 dark:to-slate-900">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-20">
    <div class="glass shadow-sm">
      <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-white/80 dark:bg-white/10 grid place-items-center shadow">
            <!-- 傘アイコン -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a8 8 0 0 0-8 8h6a2 2 0 1 1 4 0h6a8 8 0 0 0-8-8Zm0 10a1 1 0 0 0-1 1v5a3 3 0 1 1-6 0 1 1 0 0 1 2 0 1 1 0 1 0 2 0v-5a3 3 0 0 1 6 0v5a1 1 0 1 0 2 0v-5a1 1 0 0 0-1-1h-4Z"/></svg>
          </div>
          <p class="font-semibold text-slate-900 dark:text-white">Aimaitenki</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="darkToggle" class="text-xs px-3 py-1.5 rounded-lg border border-slate-300/60 dark:border-white/20 text-slate-700 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-white/10 transition">🌓 テーマ</button>
          <a th:href="@{/login}" class="text-xs px-3 py-1.5 rounded-lg bg-brand-500 text-white hover:opacity-90 transition">ログインへ</a>
        </div>
      </div>
    </div>
  </header>

  <!-- 本文 -->
  <main class="mx-auto max-w-6xl px-4 py-10">
    <div class="mx-auto max-w-xl glass rounded-2xl shadow p-6 md:p-8">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">新規登録</h1>
      <p class="mt-2 text-slate-600 dark:text-slate-300 text-sm">
        アカウントを作成すると、今日の傘アドバイスや地点の保存が使えます。
      </p>

      <!-- サーバ側メッセージ -->
      <div th:if="${param.error}" class="mt-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-sm px-3 py-2">
        登録に失敗しました。入力内容を確認してください。
      </div>
      <div th:if="${param.exists}" class="mt-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-700 text-sm px-3 py-2">
        このユーザー名は既に使われています。
      </div>

      <!-- フォーム -->
      <form th:action="@{/signup}" method="post" class="mt-6 grid grid-cols-1 gap-4" id="signupForm" novalidate>
        <div>
          <label class="text-xs text-slate-500">ユーザー名<span class="text-rose-500">*</span></label>
          <input name="username" autocomplete="username" required
                 class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
          <p class="mt-1 text-xs text-rose-600 hidden" id="uErr">ユーザー名を入力してください</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-500">パスワード<span class="text-rose-500">*</span></label>
            <div class="mt-1 relative">
              <input id="pw" name="password" type="password" autocomplete="new-password" required
                     class="w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 pr-10 outline-none focus:ring-2 focus:ring-brand-500">
              <button type="button" id="pwToggle" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-slate-500 hover:text-slate-700">表示</button>
            </div>
            <!-- 簡易強度メーター -->
            <div class="mt-2 h-1 rounded bg-slate-200 overflow-hidden">
              <div id="pwBar" class="h-full w-1/4 bg-rose-500 transition-all"></div>
            </div>
            <p id="pwHint" class="mt-1 text-[11px] text-slate-500">8文字以上、大小英字・数字・記号の併用を推奨</p>
            <p class="mt-1 text-xs text-rose-600 hidden" id="pErr">パスワードを入力してください</p>
          </div>

          <div>
            <label class="text-xs text-slate-500">パスワード（確認）<span class="text-rose-500">*</span></label>
            <input id="pw2" type="password" autocomplete="new-password" required
                   class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
            <p class="mt-1 text-xs text-rose-600 hidden" id="mErr">パスワードが一致しません</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-500">住んでいる場所（任意）</label>
            <input name="home" placeholder="例: 東京 / Osaka"
                   class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-500">目的地（任意）</label>
            <input name="destination" placeholder="例: 福岡 / Fukuoka"
                   class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mt-2 flex items-center justify-between">
          <a th:href="@{/login}" class="text-sm text-slate-600 hover:text-slate-900 dark:text-slate-300">すでにアカウントがあります？ログイン</a>
          <button type="submit"
                  class="px-5 py-2 rounded-xl bg-brand-500 text-white hover:opacity-90 shadow">
            登録する
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // ダーク/ライト
    (function(){
      const key='aimaitenki.theme',root=document.documentElement;
      const set=v=>root.classList.toggle('dark',v);
      set(localStorage.getItem(key)==='dark');
      document.getElementById('darkToggle').addEventListener('click',()=>{
        const d=!root.classList.contains('dark'); set(d); localStorage.setItem(key,d?'dark':'light');
      });
    })();

    // UI/検証
    const $=s=>document.querySelector(s);
    const pw=$('#pw'), pw2=$('#pw2'), bar=$('#pwBar'), pwToggle=$('#pwToggle');
    const uErr=$('#uErr'), pErr=$('#pErr'), mErr=$('#mErr');

    // パスワード表示切替
    pwToggle.addEventListener('click',()=>{
      const t=pw.type==='password'?'text':'password';
      pw.type=t; pw2.type=t; pwToggle.textContent=t==='text'?'非表示':'表示';
    });

    // 簡易強度
    function strength(v){
      let s=0;
      if(v.length>=8) s++;
      if(/[a-z]/.test(v)&&/[A-Z]/.test(v)) s++;
      if(/\d/.test(v)) s++;
      if(/[^a-zA-Z0-9]/.test(v)) s++;
      return s; // 0..4
    }
    pw.addEventListener('input',()=>{
      const s=strength(pw.value);
      const w=['0%','25%','50%','75%','100%'][s];
      const c=['bg-slate-300','bg-rose-500','bg-amber-500','bg-emerald-500','bg-emerald-600'][s];
      bar.className='h-full '+c; bar.style.width=w;
    });

    // 簡易バリデーション
    $('#signupForm').addEventListener('submit',(e)=>{
      let ok=true;
      if(!$('input[name="username"]').value.trim()){ uErr.classList.remove('hidden'); ok=false; } else uErr.classList.add('hidden');
      if(!pw.value){ pErr.classList.remove('hidden'); ok=false; } else pErr.classList.add('hidden');
      if(pw.value!==pw2.value){ mErr.classList.remove('hidden'); ok=false; } else mErr.classList.add('hidden');
      if(!ok) e.preventDefault();
    });
  </script>
</body>
</html>
