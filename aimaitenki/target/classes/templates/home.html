<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ホーム | Aimaitenki</title>

  <!-- CSRF for fetch -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <!-- Tailwind CDN（ビルド不要） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // Tailwindのカスタム（薄めのガラス感）
    tailwind.config = { theme: { extend: { colors: { brand: { 500: '#6366f1' }}}}};
  </script>

  <style>
    /* 細めのガラス感 */
    .glass { background: rgba(255,255,255,.75); backdrop-filter: blur(10px); }
    .dark .glass { background: rgba(17,24,39,.6); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-indigo-100 to-fuchsia-100 dark:from-slate-900 dark:via-slate-900 dark:to-slate-900">
  <!-- ヘッダー -->
  <header class="sticky top-0 z-20">
    <div class="glass shadow-sm">
      <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-white/80 dark:bg-white/10 grid place-items-center shadow">
            <!-- 傘アイコン -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a8 8 0 0 0-8 8h6a2 2 0 1 1 4 0h6a8 8 0 0 0-8-8Zm0 10a1 1 0 0 0-1 1v5a3 3 0 1 1-6 0 1 1 0 0 1 2 0 1 1 0 1 0 2 0v-5a3 3 0 0 1 6 0v5a1 1 0 1 0 2 0v-5a1 1 0 0 0-1-1h-4Z"/></svg>
          </div>
          <div>
            <p class="text-sm text-slate-600 dark:text-slate-300">ようこそ</p>
            <p class="font-semibold text-slate-900 dark:text-white" th:text="${username}">user</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
        <button id="darkToggle" class="text-xs px-3 py-1.5 rounded-lg border border-slate-300/60 dark:border-white/20 text-slate-700 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-white/10 transition">🌓 テーマ</button>

        <!-- POST /logout + CSRF（Thymeleaf） -->
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button>ログアウト</button>
        </form>

        </div>
      </div>
    </div>
  </header>

  <!-- メイン -->
  <main class="mx-auto max-w-6xl px-4 py-8">
    <!-- ヒーローカード -->
    <section class="glass rounded-2xl shadow p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
        <div class="flex items-start gap-4">
          <div id="adviceIcon" class="h-12 w-12 rounded-xl grid place-items-center bg-green-100 text-green-600 shadow-inner">
            <!-- 晴れアイコン（デフォルト） -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0-16a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1ZM3 11h1a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm17 0h1a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2ZM5.64 4.64a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41Zm10.59 10.59a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41Zm0-9.18  .71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 1 1-1.41-1.41ZM6.35 15.23l.71-.71a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-1.41-1.41Z"/></svg>
          </div>
          <div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">今日のアドバイス</h1>
            <p id="adviceText" class="mt-2 text-lg text-slate-700 dark:text-slate-200" th:text="${advice}">（未取得）</p>
            <p class="mt-1 text-xs text-slate-500">
              現在: <span id="labelHome" th:text="${home} ?: '未設定'">未設定</span>／目的地: <span id="labelDest" th:text="${destination} ?: '未設定'">未設定</span>
            </p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <span id="chipHome" class="px-3 py-1.5 text-xs rounded-full bg-slate-200 text-slate-700">home: -</span>
          <span id="chipDest" class="px-3 py-1.5 text-xs rounded-full bg-slate-200 text-slate-700">destination: -</span>
          <a class="text-xs underline text-slate-600 hover:text-slate-900" target="_blank"
             th:href="@{'/api/advice'(home=${home}, destination=${destination})}">
            /api/advice を開く
          </a>
        </div>
      </div>
    </section>

    <!-- 2カラム -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
      <!-- 設定フォーム -->
      <div class="lg:col-span-2 glass rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">地点の更新</h2>
        <form id="prefForm" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-500">住んでいる場所</label>
            <input type="text" name="home" th:value="${home}" placeholder="例: 東京 / Osaka"
                   class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-500">目的地</label>
            <input type="text" name="destination" th:value="${destination}" placeholder="例: 福岡 / Fukuoka"
                   class="mt-1 w-full rounded-xl border border-slate-300/60 bg-white/80 dark:bg-white/10 dark:text-white px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div class="md:col-span-2 flex items-center gap-3">
            <button type="submit"
                    class="px-4 py-2 rounded-xl bg-brand-500 text-white hover:opacity-90 transition shadow">
              保存して再取得
            </button>
            <span id="saveMsg" class="text-sm text-slate-500"></span>
          </div>
          <!-- CSRF -->
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
      </div>

      <!-- ステータス -->
      <div class="glass rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">現在の状況</h2>
        <ul class="mt-3 space-y-2 text-sm">
          <li class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-300" id="dotStatus"></span>
            <span id="statusText" class="text-slate-700 dark:text-slate-300">読み込み待ち...</span>
          </li>
          <li class="text-slate-500">APIキー: <span id="apiIndicator">未確認</span></li>
        </ul>
      </div>
    </section>
  </main>

  <script>
    // ダーク/ライト
    (function(){
      const key = 'aimaitenki.theme';
      const root = document.documentElement;
      const setDark = v => root.classList.toggle('dark', v);
      setDark(localStorage.getItem(key) === 'dark');
      document.getElementById('darkToggle').addEventListener('click', () => {
        const nowDark = !root.classList.contains('dark');
        setDark(nowDark);
        localStorage.setItem(key, nowDark ? 'dark' : 'light');
      });
    })();

    // 便利関数
    const $  = sel => document.querySelector(sel);
    const $$ = sel => document.querySelectorAll(sel);
    const csrf = $('meta[name="_csrf"]')?.content;
    const csrfHeader = $('meta[name="_csrf_header"]')?.content;

    // ステータス表示の更新
    function setChip(el, label, willRain) {
      el.textContent = label + ': ' + (willRain ? '雨の可能性' : '雨の可能性低');
      el.className = 'px-3 py-1.5 text-xs rounded-full ' + (willRain
        ? 'bg-rose-100 text-rose-700'
        : 'bg-emerald-100 text-emerald-700');
    }

    function setIconByNeed(need) {
      const box = $('#adviceIcon');
      box.className = 'h-12 w-12 rounded-xl grid place-items-center shadow-inner ' + (need
        ? 'bg-rose-100 text-rose-600'
        : 'bg-green-100 text-green-600');
      box.innerHTML = need
        // 雨アイコン
        ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M6 15a6 6 0 1 1 12 0v1a3 3 0 1 1-6 0v-1a1 1 0 1 0-2 0v1a3 3 0 1 1-6 0v-1Z"/><path d="M8 20a1 1 0 0 1 2 0v1a1 1 0 1 1-2 0v-1Zm6 0a1 1 0 0 1 2 0v1a1 1 0 1 1-2 0v-1Z"/></svg>'
        // 晴れアイコン
        : '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z"/></svg>';
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers: { 'Accept':'application/json' }});
      if (!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }

    async function refreshStatus() {
      const home = document.querySelector('input[name="home"]').value.trim();
      const dest = document.querySelector('input[name="destination"]').value.trim();
      $('#statusText').textContent = '取得中...';
      $('#dotStatus').className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
      try {
        let homeRain = false, destRain = false;
        if (home) {
          const j = await fetchJson('/api/will-rain?q=' + encodeURIComponent(home));
          homeRain = !!j.willRainToday;
          setChip($('#chipHome'), 'home', homeRain);
        } else {
          setChip($('#chipHome'), 'home', false);
        }
        if (dest) {
          const j2 = await fetchJson('/api/will-rain?q=' + encodeURIComponent(dest));
          destRain = !!j2.willRainToday;
          setChip($('#chipDest'), 'destination', destRain);
        } else {
          setChip($('#chipDest'), 'destination', false);
        }
        const need = homeRain || destRain;
        setIconByNeed(need);

        // 表示文言をAPIから（サーバ側判定をそのまま使う）
        const resAdvice = await fetch('/api/advice?home=' + encodeURIComponent(home) + '&destination=' + encodeURIComponent(dest));
        $('#adviceText').textContent = resAdvice.ok ? (await resAdvice.text()) : '取得に失敗しました';

        $('#statusText').textContent = '最新の情報を表示しています';
        $('#dotStatus').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
        $('#labelHome').textContent = home || '未設定';
        $('#labelDest').textContent = dest || '未設定';
        $('#apiIndicator').textContent = 'OK';
      } catch (e) {
        $('#statusText').textContent = '取得に失敗しました';
        $('#dotStatus').className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
        $('#apiIndicator').textContent = 'エラー';
        console.error(e);
      }
    }

    // 保存フォーム
    document.getElementById('prefForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = new URLSearchParams(fd);
      $('#saveMsg').textContent = '保存中...';
      const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
      if (csrf && csrfHeader) headers[csrfHeader] = csrf;
      const res = await fetch('/api/preferences', { method: 'POST', headers, body });
      if (res.ok) {
        const data = await res.json();
        $('#saveMsg').textContent = '保存しました';
        // 画面にも即反映
        document.querySelector('input[name="home"]').value        = data.home ?? '';
        document.querySelector('input[name="destination"]').value = data.destination ?? '';
        await refreshStatus();
      } else {
        $('#saveMsg').textContent = '保存に失敗（' + res.status + '）';
      }
      setTimeout(() => $('#saveMsg').textContent='', 2000);
    });

    // 初期表示でステータス更新
    window.addEventListener('DOMContentLoaded', refreshStatus);
  </script>
</body>
</html>
