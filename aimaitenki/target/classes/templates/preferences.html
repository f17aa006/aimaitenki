<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>地域設定 | 天気アドバイザー</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: linear-gradient(to bottom right, #a3d8f4, #e6f2ff);
      text-align: center;
      padding: 3em;
    }
    form {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: inline-block;
      padding: 2em;
      width: 320px;
    }
    input {
      padding: 0.5em;
      margin: 0.5em;
      width: 80%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1em;
      padding: 0.5em 1.5em;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h2>地域設定</h2>
  <form method="post" action="/preferences">
    <input type="text" name="home" placeholder="住んでいる地域 (例: 東京)" required />
    <input type="text" name="destination" placeholder="出かけ先 (例: 福岡)" required />
    <button type="submit">登録</button>
  </form>
</body>
</html>
