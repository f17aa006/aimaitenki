# ==== H2 をファイルに保存 ====
spring.datasource.driver-class-name=org.h2.Driver
# 例：ユーザーのホーム配下に「aimaitenki-db/aimai」ファイルとして保存
spring.datasource.url=jdbc:h2:file:~/aimaitenki-db/aimai;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# JPA がテーブルを自動作成・更新（create-drop は絶対NG：再起動で消える）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# タイムゾーン（任意）
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# 既存の WeatherAPI キー等はそのまま
# weatherapi.key=YOUR_KEY

# 必要ならデバッグ
# logging.level.org.springframework.security=DEBUG

weatherapi.key=

logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Spring Boot アプリケーションの設定
server.port=8080 

# Thymeleaf のキャッシュ設定（開発中はキャッシュを無効にする）
spring.thymeleaf.cache=false
# H2コンソールを有効化
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


